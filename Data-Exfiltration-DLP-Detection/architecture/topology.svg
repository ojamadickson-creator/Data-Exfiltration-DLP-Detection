<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <style>
    .box { rx: 6; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    .title { font-size: 15px; font-weight: 600; }
    .ip { font-size: 11px; fill: #666; }
    .label { font-size: 12px; fill: #444; }
    .arrow { stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .attack { stroke: #dc2626; }
    .log { stroke: #ea580c; }
    .mgmt { stroke: #0891b2; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- WAN box -->
  <rect x="20" y="80" width="220" height="360" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4" rx="8"/>
  <text x="130" y="105" text-anchor="middle" class="text title" fill="#dc2626">WAN / External</text>
  <text x="130" y="122" text-anchor="middle" class="text ip">192.168.57.0/24</text>

  <!-- Kali -->
  <rect x="50" y="150" width="160" height="80" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="130" y="180" text-anchor="middle" class="text title" fill="#991b1b">Kali Linux</text>
  <text x="130" y="200" text-anchor="middle" class="text ip">192.168.57.10</text>
  <text x="130" y="218" text-anchor="middle" class="text ip" fill="#dc2626">Attacker</text>

  <!-- Firewall -->
  <rect x="330" y="180" width="200" height="120" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="430" y="215" text-anchor="middle" class="text title" fill="#1e40af">OPNsense Firewall</text>
  <text x="430" y="240" text-anchor="middle" class="text ip">LAN: 192.168.56.254</text>
  <text x="430" y="258" text-anchor="middle" class="text ip">WAN: 192.168.57.254</text>
  <text x="430" y="280" text-anchor="middle" class="text ip" fill="#2563eb">Perimeter / Segmentation</text>

  <!-- LAN box -->
  <rect x="620" y="20" width="260" height="480" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6,4" rx="8"/>
  <text x="750" y="45" text-anchor="middle" class="text title" fill="#16a34a">LAN / Internal</text>
  <text x="750" y="62" text-anchor="middle" class="text ip">192.168.56.0/24</text>

  <!-- Win10 -->
  <rect x="650" y="90" width="200" height="90" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="125" text-anchor="middle" class="text title" fill="#166534">Win10 Workstation</text>
  <text x="750" y="148" text-anchor="middle" class="text ip">192.168.56.104</text>
  <text x="750" y="166" text-anchor="middle" class="text ip" fill="#dc2626">Victim / Management</text>

  <!-- DC -->
  <rect x="650" y="210" width="200" height="70" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="240" text-anchor="middle" class="text title" fill="#166534">Domain Controller</text>
  <text x="750" y="262" text-anchor="middle" class="text ip">192.168.56.102 (AD/DNS)</text>

  <!-- Splunk -->
  <rect x="650" y="310" width="200" height="90" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="345" text-anchor="middle" class="text title" fill="#166534">Ubuntu Splunk SIEM</text>
  <text x="750" y="368" text-anchor="middle" class="text ip">192.168.56.106</text>
  <text x="750" y="386" text-anchor="middle" class="text ip" fill="#ea580c">Log Collector</text>

  <!-- REMnux note -->
  <rect x="650" y="430" width="200" height="50" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="750" y="455" text-anchor="middle" class="text ip" fill="#6b7280">REMnux (powered off)</text>

  <!-- Arrows -->
  <!-- Attack path -->
  <path d="M 210 190 L 330 220" class="arrow attack"/>
  <text x="265" y="205" class="label" fill="#dc2626">SMB TCP 445</text>

  <!-- Firewall to LAN -->
  <path d="M 530 230 L 650 135" class="arrow attack"/>

  <!-- Log forwarding: firewall to Splunk -->
  <path d="M 430 300 Q 430 400 650 355" class="arrow log" stroke-dasharray="4,3"/>
  <text x="520" y="380" class="label" fill="#ea580c">syslog UDP 514</text>

  <!-- Log forwarding: Win10 to Splunk -->
  <path d="M 750 180 L 750 310" class="arrow log" stroke-dasharray="4,3"/>
  <text x="775" y="250" class="label" fill="#ea580c">TCP 9997</text>

  <!-- Management -->
  <path d="M 750 180 Q 580 180 430 180" class="arrow mgmt" stroke-dasharray="4,3"/>
  <text x="580" y="170" class="label" fill="#0891b2">Web UI mgmt</text>

  <!-- Legend -->
  <rect x="20" y="460" width="580" height="45" fill="#fff" stroke="#d1d5db" rx="4"/>
  <text x="35" y="480" class="label" font-weight="600">Legend:</text>
  <line x1="100" y1="475" x2="130" y2="475" stroke="#dc2626" stroke-width="3"/>
  <text x="135" y="480" class="label" fill="#dc2626">Attack path</text>
  <line x1="220" y1="475" x2="250" y2="475" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="255" y="480" class="label" fill="#ea580c">Log forwarding</text>
  <line x1="360" y1="475" x2="390" y2="475" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="395" y="480" class="label" fill="#0891b2">Management</text>
</svg>